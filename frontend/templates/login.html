<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snort NIDS - Security Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="/static/css/soc_style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 420px;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-shield-halved fa-3x text-info mb-3"></i>
            <h3 class="fw-bold brand-glow">SNORT NIDS SOC</h3>
            <p class="text-secondary small">Security Operations Center & Intrusion Detection Portal</p>
        </div>

        <div class="soc-card p-4">
            <div id="loginAlert" class="alert alert-danger d-none small"></div>

            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-user-shield"></i></span>
                        <input type="text" id="loginUsername" class="form-control bg-dark border-secondary text-light" required placeholder="admin or analyst">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="loginPassword" class="form-control bg-dark border-secondary text-light" required placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn btn-info w-100 fw-semibold py-2">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Authenticate & Enter SOC
                </button>
            </form>

            <div class="mt-4 pt-3 border-top border-secondary text-center text-muted extra-small">
                <strong>Default Demo Credentials:</strong><br>
                Admin: <code>admin</code> / <code>admin123</code><br>
                Analyst: <code>analyst</code> / <code>analyst123</code>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;
            const alertBox = document.getElementById('loginAlert');
            alertBox.classList.add('d-none');

            const bodyData = new URLSearchParams();
            bodyData.append('username', u);
            bodyData.append('password', p);

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: bodyData
                });
                if(!res.ok) {
                    const err = await res.json();
                    alertBox.textContent = err.detail || 'Authentication failed';
                    alertBox.classList.remove('d-none');
                    return;
                }
                const data = await res.json();
                localStorage.setItem('nids_token', data.access_token);
                localStorage.setItem('nids_username', data.username);
                localStorage.setItem('nids_role', data.role);
                window.location.href = '/';
            } catch(ex) {
                alertBox.textContent = 'Server connection error';
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
